name: "🐛 Bug Report"
description: "Report an issue, UI glitch, or broken behavior in KRUZZ"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve KRUZZ! Please provide as much context as possible.

  - type: input
    id: url
    attributes:
      label: Affected Page URL or Case Slug
      placeholder: "e.g., https://kruzz.indevs.in/cases/consistent-hashing-shard-ring"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
      placeholder: "Describe the unexpected behavior..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step by step how to trigger the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - "Production (kruzz.indevs.in)"
        - "Local Development (localhost:3000)"
        - "Other"
    validations:
      required: true
